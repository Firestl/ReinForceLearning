[project]
name = "reinforcelearning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Firestl", email = "ggstytt@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium[mujoco]>=1.4.0",
    "mujoco>=4.0.1",
    "numpy>=2.0",
    "stable-baselines3[extra]>=2.9.2",
    "torch>=2.15.0",
]

[project.scripts]
reinforcelearning = "reinforcelearning:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ty.analysis]
# mujoco 以编译扩展形式发布，不带 py.typed/*.pyi 存根，ty 无法解析其成员。
# 仅把 mujoco 视为 Any，避免全局关闭 missing-attribute 而掩盖本仓库的真实错误。
replace-imports-with-any = ["mujoco"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32'" }]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
    "ty>=0.0.104",
]
